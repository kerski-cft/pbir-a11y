id: jr5q8mzq1vwbh0a2c9dfeg7m
name: Code Quality Tooling
description: >
  Give pbir-a11y's own codebase the same rigor it demands of the reports
  it audits: lint enforcement, full rule-check test coverage, and a
  file-size guideline for new/non-ported TypeScript (see vision.md ->
  Key Constraints and Success Criteria, added 2026-09-14). Corresponds
  to the three new epics appended to plan.md's Current Priorities.
personas:
  - psn7xk3mzq1vwbh0a2c9dfeg
createdAt: 1789401107439
updatedAt: 1789401107439
steps:
  - id: st1p8mzq1vwbh0a2c9dfeg7k
    name: Lint gate for new TypeScript
    description: >
      Add a configured linter for new/non-ported TypeScript so style and
      bug-prone patterns are caught by tooling instead of relying on
      manual review. Scoped per discovery on 2026-09-14: npm-script-only
      gate (no CI workflow or git hook yet), typescript-eslint
      "recommended" rule set, lint-only (no Prettier/formatter bundled
      in).
    createdAt: 1789401107439
    updatedAt: 1789401107439
    userStories:
      - id: us9k2mzq1vwbh0a2c9dfeg7h
        name: Automatic lint enforcement for new code
        description: >
          As a pbir-a11y maintainer, I want new TypeScript to be linted
          automatically, so that style/bug-prone patterns are caught
          before merge instead of relying on manual review alone.
        painPoint:
          id: pp3h8mzq1vwbh0a2c9dfeg7x
          name: Inconsistent style/bug-prone patterns slip through review
          description: >
            Without a configured linter, style and bug-prone patterns
            (unused vars, floating promises, etc.) are caught only by
            manual review, if at all, making reviews slower and letting
            real bugs through.
          impact: 6
          frequency: 8
          createdAt: 1789401107439
          updatedAt: 1789401107439
        priority: 48
        functionalRequirements:
          - Given a file in src/commands/, src/io/, src/cli.ts, or
            test-files/ with a typescript-eslint "recommended"
            violation, running `npm run lint` should report it with
            file/line and exit non-zero.
          - Given src/lib/* (the ported rule engine), running
            `npm run lint` should not fail on its pre-existing patterns
            — the vision.md carve-out for ported code applies.
          - Given no violations, running `npm run lint` should exit 0
            with no errors.
          - Given the codebase as it exists today, the first `npm run
            lint` run may surface existing violations in
            src/commands/, src/io/, src/cli.ts, and test-files/; this
            story isn't done until those are fixed (zero errors at
            handoff).
        mockups: []
        status:
          state: released
          comment: >
            Completed 2026-09-14 via tasks/archive/2026-09-14-lint-gate-for-new-typescript.md.
            ESLint + typescript-eslint recommended via `npm run lint`,
            scoped to non-ported code; fixed the one pre-existing
            violation in check.ts.
        createdAt: 1789401107439
        updatedAt: 1789401107439
  - id: st2q9nzr2wxci1b3d0egfh8l
    name: Full rule-check test coverage + coverage report
    description: >
      Cover every rulesEngine.ts Category with tests in test-files/, and
      add a coverage tool reporting a concise per-file summary.
    createdAt: 1789401107439
    updatedAt: 1789403154581
    userStories:
      - id: us4t1pav4yzek3d5f2ghij0n
        name: Direct test coverage for every rule-check category
        description: >
          As a pbir-a11y maintainer, I want every automated rule-check
          category to have direct test coverage and a coverage-threshold
          gate, so that a change to rulesEngine.ts can't silently break a
          rule's behavior without a failing test.
        painPoint:
          id: pp5u2qbw5zafl4e6g3hijk1o
          name: An untested rule-check category could silently regress
          description: >
            Only altText (and its groupNaming sub-case) have direct
            tests today; the other 8 categories (visualTitles,
            axisTitles, fontScaling, contrast, colourblind, pageTitles,
            tabOrder, targetSize, clutter) have none, so a change could
            break one without any test failing — undermining vision.md's
            core parity-with-the-original-tool promise.
          impact: 9
          frequency: 5
          createdAt: 1789403154581
          updatedAt: 1789403154581
        priority: 45
        functionalRequirements:
          - Given each of visualTitles, axisTitles, fontScaling,
            contrast, pageTitles, tabOrder, targetSize, and clutter,
            should have at least one test-files/ test exercising a
            flagged case AND at least one exercising a compliant case
            that must NOT be flagged (false-positive guard), via
            analyze() against the thin-report fixture.
          - Given colourblind (whose analyze()-level emission is
            commented out — it's a UI-simulator toggle, not an automated
            rule), should have a direct unit test of
            colourblindUtils.findCollisions() instead.
          - Given `npm run coverage`, should run node --test
            --experimental-test-coverage scoped to src/lib/**, report a
            concise per-file summary, and exit non-zero below the
            threshold gate.
          - Given the coverage gate's threshold, should be set at
            approximately today's baseline (~65% lines on src/lib/**) so
            it locks in current coverage as a floor without demanding an
            immediate leap.
        mockups: []
        status:
          state: released
          comment: >
            Completed 2026-09-14 via
            tasks/archive/2026-09-14-full-rule-check-test-coverage.md. All
            9 categories (plus colourblind at the util level) have
            flagged + compliant tests; npm run coverage gate added at
            60% lines on src/lib/**; actual coverage rose 64.48% ->
            77.44%. Also extracted test-files/testHelpers.ts to remove
            duplicated fixture-loading boilerplate across all 6 test
            files.
        createdAt: 1789403154581
        updatedAt: 1789403154581
  - id: st3r0osz3xydj2c4e1fhgi9m
