id: jr6r9paw6zyej3d5f2ghij1o
name: Release Tooling
description: >
  Give pbir-a11y a structured, low-effort release process instead of ad
  hoc package.json edits (which is exactly how the CLI's --version bug
  happened — see tasks/archive/ for the fix).
personas:
  - psn7xk3mzq1vwbh0a2c9dfeg
createdAt: 1789405039838
updatedAt: 1789405039838
steps:
  - id: st4s1pbx7bzfk4e6g3hijl2p
    name: /release command for version bumps
    description: >
      A new /release command that proposes a version bump (inferred from
      conventional-commit types since the last release) and creates a
      git tag, sized small per vision.md's minimal-dependencies stance —
      no CI/semantic-release pulled in.
    createdAt: 1789405039838
    updatedAt: 1789405039838
    userStories:
      - id: us6w4rcy8cahn5f7h4ijkm3q
        name: Consistent, low-effort version bumps
        description: >
          As a pbir-a11y maintainer, I want a /release command that
          proposes a version bump (inferred from conventional-commit
          types since the last release) and creates a git tag, so
          releases follow a consistent process instead of ad hoc edits
          that can drift.
        painPoint:
          id: pp7x5sdz9dbio6g8i5jkln4r
          name: Version bumps are ad hoc, causing drift
          description: >
            Versioning today is a manual package.json edit with no
            process — confirmed via git log: only one prior "Bump
            version to 0.2.0" commit in the repo's whole history. This is
            exactly how the CLI's --version bug happened (hardcoded
            "0.1.0" never updated as package.json advanced to 0.3.2).
          impact: 7
          frequency: 3
          createdAt: 1789405039838
          updatedAt: 1789405039838
        priority: 21
        functionalRequirements:
          - Given commits since the last version-bump commit (found by
            scanning git log for changes to package.json's version
            field, since no git tags exist yet), should classify each by
            conventional-commit type and propose a bump level: any feat
            -> minor, fix-only -> patch, a "!" or "BREAKING CHANGE:"
            footer -> major (highest triggered level wins).
          - Given the proposed version + level, should present it for
            confirmation/override before applying anything.
          - Given confirmation, should update package.json's version,
            commit that change, and create an annotated git tag (e.g.
            v0.4.0) pointing at it.
          - Given no release-worthy commits since the last bump (only
            chore/docs/test), should say so rather than proposing a
            bump.
          - Should never push the commit or tag automatically — matches
            the existing /commit convention.
        mockups: []
        status:
          state: released
          comment: >
            Completed 2026-09-14 via
            tasks/archive/2026-09-14-release-command.md. Built as
            .claude/skills/aidd-release/ (propose-release.js +
            apply-release.js, per aidd-upskill's deterministic-logic-in-
            scripts guidance) plus /release command and CLAUDE.md entry.
            Verified end-to-end against real history (proposed 0.3.2 ->
            0.4.0 minor bump). A review pass caught a real gap — the
            apply script didn't check for pre-existing staged changes
            before committing — fixed before merge. Not yet used for a
            real bump (per the maintainer's choice to build first).
        createdAt: 1789405039838
        updatedAt: 1789405039838
